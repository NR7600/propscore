<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BH Props">
  <meta name="description" content="Da Real Big Homie Props — NBA and NHL player prop trend research. 21+, research only.">
  <title>Da Real Big Homie Props</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="top-row">
        <a class="brand" href="#/" aria-label="Da Real Big Homie Props home">
          <img src="/icons/icon-192.png" alt="" width="28" height="28">
          <span>Da Real Big Homie <span class="accent">Props</span></span>
        </a>
        <nav class="sports" aria-label="Sports">
          <button class="sport on" data-sport="nba">NBA</button>
          <button class="sport" data-sport="nhl" type="button">NHL</button>
          <button class="sport soon" data-sport="nfl" type="button">NFL</button>
        </nav>
      </div>
      <p class="date-line" id="date-line">Loading tonight’s slate…</p>
    </header>

    <section id="board-view">
      <div class="games" id="games" role="list" aria-label="Tonight’s games"></div>

      <div class="toolbar">
        <label class="search">
          <span class="sr-only">Search players</span>
          <input id="q" type="search" placeholder="Search a player or team" autocomplete="off">
        </label>
        <div class="stat-pills" id="stats">
          <button class="pill on" data-stat="">All</button>
          <button class="pill" data-stat="points">PTS</button>
          <button class="pill" data-stat="rebounds">REB</button>
          <button class="pill" data-stat="assists">AST</button>
          <button class="pill" data-stat="threes">3PM</button>
          <button class="pill" data-stat="pra">PRA</button>
        </div>
        <div class="filter-bar">
          <label class="toggle">
            <input type="checkbox" id="view-value" checked>
            <span>Best value</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="hide-out" checked>
            <span>Hide Out</span>
          </label>
          <label class="toggle" id="gimme-wrap" hidden>
            <input type="checkbox" id="hide-gimme">
            <span>Hide easy 100%</span>
          </label>
          <label class="range">
            <span>Min L10 <strong id="min-label">70%</strong></span>
            <input id="min-l10" type="range" min="0" max="100" step="5" value="70">
          </label>
        </div>
        <p class="view-note" id="view-note"></p>
      </div>

      <p class="count" id="count"></p>
      <div id="list" class="list"></div>
      <div class="pager">
        <button id="more" class="more" hidden>Load more</button>
        <p class="empty" id="empty" hidden>No props match these filters.</p>
        <p class="status" id="status"></p>
      </div>
      <div id="install" class="install" hidden>
        <p>Add Da Real Big Homie Props to your Home Screen for a full-screen app. On iPhone: Share → Add to Home Screen.</p>
        <button type="button" id="install-dismiss">Got it</button>
      </div>
    </section>

    <section id="player-view" hidden>
      <button class="back" id="back" type="button">← Board</button>
      <div id="player-header"></div>
      <div id="player-lines" class="stat-pills wrap"></div>
      <div id="player-stats" class="rates"></div>
      <div id="chart-wrap"></div>
    </section>
  </div>

  <div id="toast" class="toast" hidden></div>
  <footer class="legal">Research only — not a sportsbook, not betting advice. 21+.</footer>
  <script src="/app.js"></script>
</body>
</html>

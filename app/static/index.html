<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BH Props">
  <meta name="description" content="Da Real Big Homie Props — NBA, NHL, and NFL player prop trend research. 21+, research only.">
  <title>Da Real Big Homie Props</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="top-row">
        <a class="brand" href="#/" aria-label="Da Real Big Homie Props home">
          <img src="/icons/icon-192.png" alt="" width="28" height="28">
          <span>Da Real Big Homie <span class="accent">Props</span></span>
        </a>
        <nav class="sports" aria-label="Sports">
          <button class="sport on" data-sport="nba">NBA</button>
          <button class="sport" data-sport="nhl" type="button">NHL</button>
          <button class="sport" data-sport="nfl" type="button">NFL</button>
        </nav>
      </div>
      <p class="date-line" id="date-line">Loading tonight’s slate…</p>
    </header>

    <section id="board-view">
      <div class="trend-tabs" role="tablist" aria-label="Over or under">
        <button type="button" class="trend-tab on" data-side="" data-tab="all" role="tab">All Trends</button>
        <button type="button" class="trend-tab" data-side="over" data-tab="over" role="tab">Over Trends</button>
        <button type="button" class="trend-tab" data-side="under" data-tab="under" role="tab">Under Trends</button>
      </div>

      <div class="games" id="games" role="list" aria-label="Tonight’s games"></div>

      <div class="toolbar">
        <div class="smart-filters">
          <span class="smart-label">Smart filters:</span>
          <label class="check">
            <input type="checkbox" id="perfect">
            <span>100% Trends</span>
          </label>
          <label class="check">
            <input type="checkbox" id="sort-streak">
            <span>Longest Streaks</span>
          </label>
        </div>
        <div class="stat-pills" id="stats"></div>
        <label class="search">
          <span class="sr-only">Search players</span>
          <input id="q" type="search" placeholder="Search players…" autocomplete="off">
        </label>
        <div class="filter-bar">
          <label class="toggle">
            <input type="checkbox" id="view-value">
            <span>Best value</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="hide-out">
            <span>Hide Out</span>
          </label>
          <label class="toggle" id="gimme-wrap" hidden>
            <input type="checkbox" id="hide-gimme">
            <span>Hide easy 100%</span>
          </label>
        </div>
        <p class="view-note" id="view-note"></p>
      </div>

      <p class="count" id="count"></p>
      <section id="top-wrap" hidden>
        <h2 class="section-title" id="top-title">Top 10 Trends</h2>
        <div id="top-list" class="list top-list"></div>
      </section>
      <section id="more-block" hidden>
        <div id="list" class="list"></div>
      </section>
      <div class="pager">
        <p class="empty" id="empty" hidden>No props match these filters.</p>
        <p class="status" id="status"></p>
      </div>
      <div id="install" class="install" hidden>
        <p>Add Da Real Big Homie Props to your Home Screen for a full-screen app. On iPhone: Share → Add to Home Screen.</p>
        <button type="button" id="install-dismiss">Got it</button>
      </div>
    </section>

    <section id="player-view" hidden>
      <button class="back" id="back" type="button">← Board</button>
      <div id="player-header"></div>
      <div id="player-lines" class="stat-pills wrap"></div>
      <div id="chart-wrap"></div>
      <div id="player-stats" class="rates"></div>
      <div id="player-context" class="context"></div>
      <div class="detail-tabs" role="tablist">
        <button type="button" class="detail-tab on" data-tab="box">Box Score</button>
        <button type="button" class="detail-tab" data-tab="matchup">Matchup</button>
        <button type="button" class="detail-tab" data-tab="injuries">Injuries</button>
        <button type="button" class="detail-tab" data-tab="news">News</button>
      </div>
      <div id="player-panel"></div>
    </section>
  </div>

  <div id="modal-root" class="modal-root" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal" role="dialog" aria-modal="true" id="modal">
      <button type="button" class="modal-close" data-close-modal aria-label="Close">×</button>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <footer class="legal">Research only — not a sportsbook, not betting advice. 21+.</footer>
  <script src="/app.js"></script>
</body>
</html>
